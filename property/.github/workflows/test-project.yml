name: Run Application Test

on:
  pull_request:
    branches:
      - main
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with: 
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run format
        run: npm run format

      - name: Run check 
        run: npm run check

      - name: Run tsc
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test
