name: Deploy to Supabase

on:
  workflow_dispatch:
    inputs:
      supabase_access_token:
        description: "Supabase PAT (Primary option)"
        required: false
        default: ""
      supabase_project_id:
        description: "Supabase Project ID"
        required: false
        default: ""
      supabase_db_password:
        description: "DB Password (Secondary option if PAT unavailable/JIT disabled)"
        required: false
        default: ""

jobs:
  deploy:
    name: Deploy to Supabase
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ inputs.supabase_access_token != '' && inputs.supabase_access_token || secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ inputs.supabase_project_id != '' && inputs.supabase_project_id || secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ inputs.supabase_db_password != '' && inputs.supabase_db_password || secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Verify Credentials and Determine Link Password
        id: credentials
        run: |
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "Error: SUPABASE_PROJECT_ID is not set."
            exit 1
          fi

          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Primary option selected: PAT is provided."
            if [ -n "$SUPABASE_DB_PASSWORD" ]; then
              echo "db_password=$SUPABASE_DB_PASSWORD" >> $GITHUB_ENV
            else
              echo "db_password=$SUPABASE_ACCESS_TOKEN" >> $GITHUB_ENV
            fi
          elif [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "Secondary option selected: Using provided DB Password."
            echo "db_password=$SUPABASE_DB_PASSWORD" >> $GITHUB_ENV
          else
            echo "Error: Neither SUPABASE_ACCESS_TOKEN nor SUPABASE_DB_PASSWORD is set."
            exit 1
          fi

      - name: Link Project
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID" -p "$db_password"

      - name: Reset Public Schema & Crons
        run: |
          supabase db query --linked -f supabase/migrations/20260101000001_schema.sql
          echo "Successfully applied database schema and crons."

      - name: Configure Default Platform Secrets
        if: env.SUPABASE_ACCESS_TOKEN != ''
        env:
          CENTRAL_URL: ${{ secrets.CENTRAL_URL }}
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
        run: |
          SECRETS=""
          [ -n "$CENTRAL_URL" ] && SECRETS="$SECRETS CENTRAL_URL=$CENTRAL_URL"
          [ -n "$APP_SECRET_KEY" ] && SECRETS="$SECRETS APP_SECRET_KEY=$APP_SECRET_KEY"
          if [ -n "$SECRETS" ]; then
            supabase secrets set $SECRETS --project-ref "$SUPABASE_PROJECT_ID" || true
            echo "Configured default platform secrets."
          fi

      - name: Deploy Edge Functions
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            supabase functions deploy --no-verify-jwt --project-ref $SUPABASE_PROJECT_ID
          else
            echo "Skipping Edge Functions deployment as SUPABASE_ACCESS_TOKEN (PAT) is not provided."
          fi
