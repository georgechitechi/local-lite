name: Deploy Release to Play Store

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag Name (e.g. v1.0.0)"
        required: true
        type: string

      package_name:
        description: "Android Package Name (default: com.propertyadmin.manager)"
        required: false
        type: string
        default: "com.propertyadmin.manager"

      track:
        description: "Play Store Track (default: alpha)"
        required: false
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
        default: "alpha"

jobs:
  deploy:
    name: Publish AAB to Play Store
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 📋 Log Action Inputs
        run: |
          echo "=== Action Inputs ==="
          echo "tag_name: ${{ inputs.tag_name }}"
          echo "package_name: ${{ inputs.package_name }}"
          echo "track: ${{ inputs.track }}"
          echo "====================="

      - name: 📥 Download AAB from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag_name }}"
          echo "Downloading assets for release tag: $TAG"
          mkdir -p release-artifacts
          gh release download "$TAG" --pattern "*.aab" --dir release-artifacts
          ls -la release-artifacts

      - name: 📝 Prepare Release Notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p whatsnew
          NOTES="$(gh release view "${{ inputs.tag_name }}" --json body -q .body 2>/dev/null || echo "")"
          if [ -z "$NOTES" ] || [ "$NOTES" == "null" ]; then
            NOTES="We are constantly working to improve your experience. This update includes performance improvements, bug fixes, and enhancements to keep the app running smoothly."
          fi
          # Play Store max 500 chars; truncate if needed
          NOTES=$(echo -e "$NOTES" | head -c 500)
          echo "$NOTES" > whatsnew/whatsnew-en-US
          echo "--- Release Notes ---"
          cat whatsnew/whatsnew-en-US

      - name: 📱 Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
          packageName: ${{ inputs.package_name }}
          releaseFiles: release-artifacts/*.aab
          tracks: ${{ inputs.track || 'alpha' }}
          status: completed
          whatsNewDirectory: whatsnew
